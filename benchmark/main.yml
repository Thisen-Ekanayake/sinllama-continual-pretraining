# benchmark/main.yml
# Shared config for every task under benchmark/: which models to score,
# where each task's dataset lives, where results go, and the GCS bucket
# to upload them to. All paths are relative to the repo root unless
# absolute or ~-prefixed. Task-specific hyperparameters live in each
# task's own config.yml (benchmark/<task>/config.yml).

# Models evaluated by mmlu / hellaswag / piqa, and LoRA-finetuned (one
# adapter each) by downstream. Each entry must be a ready-to-load model
# dir (base weights already merged with any prior LoRA/CPT deltas).
models:
  - name: llama-3-8b
    path: models/llama-3-8b
  - name: SinLlama_v01
    path: models/SinLlama_v01
  - name: SinLlama_cpt
    path: models/SinLlama_cpt
  - name: SinLlama_Bactrianx_Instruct
    path: models/SinLlama_Bactrianx_Instruct
  - name: SinLlama_v02
    path: models/SinLlama_v02
  # UltraChat-Sinhala chat SFT on top of v02. Scored RAW, not via their chat
  # template, so the numbers are directly comparable to SinLlama_v02 above --
  # a `chat_models` path analogous to alpaca_models does not exist yet.
  # _cleaned is the same recipe retrained on the de-artifacted corpus; keeping
  # both makes the dirty-vs-clean delta measurable. See
  # docs/uc-instruct-evaluation.md and docs/ultrachat-cleaning.md.
  - name: SinLlama_uc_instruct
    path: models/SinLlama_uc_instruct
  - name: SinLlama_uc_instruct_cleaned
    path: models/SinLlama_uc_instruct_cleaned
  # Stage-2 SFT of uc_instruct_cleaned on the bilingual UltraChat `gen` mix
  # (75% Sinhala / 25% English, disjoint prompt_ids from the sft split
  # uc_instruct_cleaned already saw). See docs/gen-stage.md. Scored RAW like
  # uc_instruct_cleaned above, for the same reason: raw is what keeps its
  # number comparable across the v02 -> uc_instruct_cleaned -> this chain.
  - name: SinLlama_UC_Gen_Model
    path: models/SinLlama_UC_Gen_Model
  # Stage-3 SFT of SinLlama_UC_Gen_Model on Sinhala Wikipedia (short+medium
  # articles wrapped as single-turn "tell me about X" pairs in the same
  # UltraChat template, LoRA r8/alpha16/lr5e-5). See wikipedia_sft/config.yaml.
  # Scored RAW like the two models above, for the same reason: raw is what keeps
  # its number comparable across the v02 -> uc_instruct_cleaned -> gen -> this chain.
  - name: SinLlama_wiki
    path: models/SinLlama_wiki

# Model-name substrings scored/finetuned in the Alpaca
# "### Instruction / ### Input / ### Response" template instead of the
# task's raw template.
alpaca_models:
  - SinLlama_Bactrianx_Instruct

# Model-name substrings scored in the UltraChat chat template
# ("### User:\n...\n\n### Assistant:\n...<|end_of_text|>") from sft/config.yaml,
# the analogue of alpaca_models above. Leave EMPTY to score every model raw --
# raw is what makes an instruct model's number comparable to its own base, while
# the chat format is what the model actually saw in training. Both are worth
# having; see docs/uc-instruct-evaluation.md.
chat_models:
  - SinLlama_uc_instruct

datasets:
  mmlu:
    sinhala: benchmark/mmlu/SinhalaMMLU
    english: benchmark/mmlu/english_mmlu
  hellaswag:
    english: "~/hellaswag"
    sinhala: "~/HellaSwag/data/translated"
  piqa:
    parallel: benchmark/mrlbenchmarks/global-piqa-parallel/0.jsonl
    nonparallel: benchmark/mrlbenchmarks/global-piqa-nonparallel/0.jsonl
  downstream:
    news: data/news
    sentiment: data/sentiment
    writing: data/Writing

output_root: benchmark/results

gcs:
  # UNDERSCORE. gs://sinllama-cpt (hyphen) does not exist -- upload_to_gcs
  # (lib/gcs_upload.sh) only warns on failure, so this typo silently dropped
  # every benchmark upload until now; every other script in the repo (sft/,
  # gen/, cpt/) already uses the correct underscore form.
  bucket_root: gs://sinllama_cpt
